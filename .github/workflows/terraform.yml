name: Deploy Streamlit to Cloud Run

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: gen-lang-client-0056426034
      REGION: us-central1
      SERVICE_NAME: streamlit-app
      BUCKET_NAME: moviant-gemini-bucket-12345

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Authenticate with Google Cloud using SA key JSON in secret GCP_SA_KEY
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 2) Terraform – just ensures the bucket config is valid / readable
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      # 3) Make sure required APIs are enabled (no-op if already enabled)
      - name: Enable required APIs
        run: |
          gcloud services enable \
            run.g
