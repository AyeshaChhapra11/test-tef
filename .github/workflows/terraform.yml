name: Deploy Streamlit to Cloud Run

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: gen-lang-client-0056426034
      REGION: us-central1
      SERVICE_NAME: streamlit-app
      BUCKET_NAME: moviant-gemini-bucket-12345

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate with Google Cloud
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # Terraform – validates bucket config / reads existing bucket
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      # Check bucket exists
      - name: Check GCS Bucket
        run: |
          gsutil ls -b gs://${BUCKET_NAME}
          echo "Bucket exists!"

      # Deploy Streamlit app to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${SERVICE_NAME} \
            --source . \
            --platform managed \
            --region ${REGION} \
            --allow-unauthenticated \
            --quiet
